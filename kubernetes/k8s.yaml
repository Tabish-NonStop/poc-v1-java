apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-v1-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-v1-java
  template:
    metadata:
      labels:
        app: poc-v1-java
    spec:
      containers:
        - name: poc-v1-java
          image: poc-v1-java:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: poc-v1-java-svc
spec:
  selector:
    app: poc-v1-java
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
